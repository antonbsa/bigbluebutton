name: Merge and upload blob reports
description: Merge and upload the blob reports to GitHub Actions Artifacts
runs:
  using: composite
  steps:
    - name: Check for failed blob reports
      uses: actions/github-script@v7
      with:
        script: |
          const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });
          const failed = artifacts.data.artifacts.filter((artifact) => {
            return artifact.name.startsWith('blob-report-failed-');
          });
          if (failed.length < 1) {
            core.exportVariable('FAILED_BLOB_REPORTS_FOUND', 'false');
            console.log('No failed blob reports found');
            return;
          }
          core.exportVariable('FAILED_BLOB_REPORTS_FOUND', 'true');
    - name: Install dependencies
      shell: bash
      working-directory: ./bigbluebutton-tests/playwright
      run: npm ci
    - name: Merge artifacts
      if: ${{ env.FAILED_BLOB_REPORTS_FOUND == 'true' }}
      uses: actions/upload-artifact/merge@v4
      with:
        name: all-blob-reports
        pattern: blob-report-failed-*
        delete-merged: true
    - name: Download all blob reports from GitHub Actions Artifacts
      if: ${{ env.FAILED_BLOB_REPORTS_FOUND == 'true' }}
      uses: actions/download-artifact@v4
      with:
        name: all-blob-reports
        path: bigbluebutton-tests/playwright/all-blob-reports
    - name: Merge into HTML Report
      if: ${{ env.FAILED_BLOB_REPORTS_FOUND == 'true' }}
      shell: bash
      working-directory: ./bigbluebutton-tests/playwright
      run: npx playwright merge-reports --reporter html ./all-blob-reports -c playwright.config.ts
    - name: Upload HTML tests report
      if: ${{ env.FAILED_BLOB_REPORTS_FOUND == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: tests-report
        overwrite: true
        path: bigbluebutton-tests/playwright/playwright-report
    - name: Remove unnecessary artifacts
      uses: geekyeggo/delete-artifact@v5
      with:
        name: |
          all-blob-reports
          blob-report-*
        failOnError: false
